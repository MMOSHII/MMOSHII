<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="MMOSHII animated developer banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <style>
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin:center; }
      .pulse2 { animation: pulse 2.4s ease-in-out .8s infinite; transform-origin:center; }
      .float { animation: float 5s ease-in-out infinite; }
      .float2 { animation: float 6s ease-in-out 1s infinite; }
      .scan { animation: scan 4s linear infinite; }
      .dash { stroke-dasharray: 10 16; animation: dash 3s linear infinite; }
      .blink { animation: blink 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.45;transform:scale(.8)} 50%{opacity:1;transform:scale(1.25)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
      @keyframes scan { from{transform:translateX(-120px);opacity:0} 20%{opacity:.7} 80%{opacity:.7} to{transform:translateX(1200px);opacity:0} }
      @keyframes dash { to{stroke-dashoffset:-52} }
      @keyframes blink { 0%,45%,100%{opacity:.2} 50%,65%{opacity:1} }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- subtle animated scan -->
  <rect class="scan" x="0" y="0" width="2" height="300" fill="#3b82f6" opacity=".45" filter="url(#glow)"/>

  <!-- decorative rails -->
  <g fill="none" stroke-linecap="round">
    <path d="M35 55H220" stroke="#94a3b8" stroke-opacity=".45"/>
    <path d="M35 55H95" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="35" cy="55" r="3" fill="#3b82f6"/>
    <path d="M980 48h105l35-35h50" stroke="#3b82f6" stroke-opacity=".7"/>
    <path d="M1005 65h70l35-35h60" stroke="#64748b" stroke-opacity=".5"/>
    <path d="M35 245h155" stroke="#64748b" stroke-opacity=".45"/>
    <path d="M1040 238h65l30-30h65" stroke="#3b82f6" stroke-opacity=".65"/>
  </g>

  <!-- left code motif -->
  <g class="float" transform="translate(55 112)" fill="none" stroke-linecap="round">
    <path d="M0 0h115" stroke="#64748b" stroke-width="3"/>
    <path d="M0 18h72" stroke="#2563eb" stroke-width="3"/>
    <path d="M0 36h95" stroke="#94a3b8" stroke-width="3"/>
    <path d="M0 54h48" stroke="#2563eb" stroke-width="3"/>
    <path d="M62 54h82" stroke="#64748b" stroke-width="3"/>
    <path d="M0 72h82" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- central title -->
  <g text-anchor="middle" fill="#f8fafc">
    <text x="600" y="132" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="14">MMOSHII</text>
    <text x="600" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="7" fill="#94a3b8">BUILD  •  LEARN  •  SHIP</text>
  </g>

  <!-- animated accent line -->
  <g class="dash">
    <path d="M405 190H795" stroke="url(#blue)" stroke-width="2" opacity=".9"/>
  </g>

  <!-- network -->
  <g class="float2" fill="none" stroke="#475569" stroke-opacity=".55">
    <path d="M900 92L970 130L1040 82L1100 138L1150 92"/>
    <path d="M970 130L1005 190L1100 138L1130 205L1040 82"/>
    <path d="M900 92L930 190L1005 190L1100 138"/>
    <path d="M930 190L875 150"/>
  </g>

  <g filter="url(#glow)">
    <circle class="pulse" cx="900" cy="92" r="4" fill="#3b82f6"/>
    <circle class="pulse2" cx="970" cy="130" r="5" fill="#60a5fa"/>
    <circle class="pulse" cx="1040" cy="82" r="4" fill="#2563eb"/>
    <circle class="pulse2" cx="1100" cy="138" r="5" fill="#60a5fa"/>
    <circle class="pulse" cx="1150" cy="92" r="3" fill="#3b82f6"/>
    <circle class="pulse2" cx="1005" cy="190" r="4" fill="#3b82f6"/>
    <circle class="blink" cx="1130" cy="205" r="3" fill="#60a5fa"/>
    <circle class="pulse" cx="930" cy="190" r="4" fill="#2563eb"/>
    <circle class="blink" cx="875" cy="150" r="3" fill="#94a3b8"/>
  </g>

  <!-- tiny status indicators -->
  <g font-family="monospace" font-size="10" fill="#64748b">
    <text x="55" y="278">/ MMOSHII.DEV</text>
    <text x="1010" y="278">SYSTEM: ONLINE</text>
  </g>
  <circle class="blink" cx="1000" cy="275" r="3" fill="#3b82f6"/>
</svg>
