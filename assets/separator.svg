<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="100%" height="30">
  <defs>
    <linearGradient id="main-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9B51E0" stop-opacity="1" />
      <stop offset="80%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulse-from-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulse-from-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .glow-effect {
      filter: url(#glow);
    }
    
    .sweep-left-to-center {
      animation: moveLeftToCenter 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .sweep-right-to-center {
      animation: moveRightToCenter 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .center-node {
      animation: pulseSync 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: 600px 15px;
    }

    @keyframes moveLeftToCenter {
      0% { transform: translateX(-200px); opacity: 0; }
      20% { opacity: 1; }
      50% { transform: translateX(475px); opacity: 1; }
      70%, 100% { transform: translateX(475px); opacity: 0; }
    }

    @keyframes moveRightToCenter {
      0% { transform: translateX(1200px); opacity: 0; }
      20% { opacity: 1; }
      50% { transform: translateX(525px); opacity: 1; }
      70%, 100% { transform: translateX(525px); opacity: 0; }
    }

    @keyframes pulseSync {
      0%, 45% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.6); opacity: 1; filter: drop-shadow(0 0 8px #00F2FE); }
      65%, 100% { transform: scale(1); opacity: 0.5; }
    }
  </style>

  <rect x="0" y="14" width="1200" height="2" fill="url(#main-gradient)" opacity="0.6" filter="url(#glow)" />
  <rect class="glow-effect" x="0" y="14" width="1200" height="2" rx="1" fill="url(#main-gradient)" />

  <g class="glow-effect">
    <rect class="sweep-left-to-center" x="0" y="13" width="200" height="4" fill="url(#pulse-from-left)" rx="2" />
    <rect class="sweep-right-to-center" x="0" y="13" width="200" height="4" fill="url(#pulse-from-right)" rx="2" />
  </g>

  <g class="center-node">
    <polygon points="600,9 606,15 600,21 594,15" fill="#FFFFFF" filter="url(#glow)" />
  </g>
</svg>
